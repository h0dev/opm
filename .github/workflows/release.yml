name: Build and Release Binaries

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as vMAJOR.MINOR.PATCH (e.g. v2.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: opm-linux-x86_64
            features: ""
            use_docker: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: opm-linux-aarch64
            features: ""
            use_docker: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: opm-linux-x86_64-webui
            features: "webui"
            use_docker: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: opm-linux-aarch64-webui
            features: "webui"
            use_docker: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: opm-macos-x86_64
            features: ""
            use_docker: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: opm-macos-aarch64
            features: ""
            use_docker: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (Linux only)
        if: matrix.use_docker
        run: |
          docker build -t opm-builder-debian10 -f Dockerfile.debian10 .

      - name: Build release binary (Linux with Docker)
        if: matrix.use_docker
        run: |
          docker run --rm \
            -v $PWD:/build \
            -w /build \
            -e CC_aarch64_unknown_linux_gnu=${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }} \
            -e CXX_aarch64_unknown_linux_gnu=${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-g++' || '' }} \
            -e AR_aarch64_unknown_linux_gnu=${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-ar' || '' }} \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }} \
            opm-builder-debian10 \
            bash -c "rustup target add ${{ matrix.target }} && cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}"

      - name: Setup Rust (macOS)
        if: ${{ !matrix.use_docker }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary (macOS)
        if: ${{ !matrix.use_docker }}
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/opm artifacts/${{ matrix.artifact_name }}
          chmod +x artifacts/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Create or Update Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "opm-*" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Resolve the version being released
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          # One shape only: vMAJOR.MINOR.PATCH. The tag is the version users see
          # and the one `opm update` compares against, so it is validated here
          # rather than discovered later by a broken client.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches Cargo.toml
        run: |
          MANIFEST=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$MANIFEST" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::Cargo.toml is $MANIFEST but the tag is ${{ steps.version.outputs.version }}; bump Cargo.toml and commit before tagging"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## OPM ${{ steps.version.outputs.version }}

            Built from commit ${{ github.sha }}.

            **This build identifies itself as version ${{ steps.version.outputs.number }}**, and
            `opm update` compares that version against the newest release, so upgrading
            from any older build picks this one up.

            ### Available binaries

            | Asset | Platform |
            |---|---|
            | `opm-linux-x86_64` | Linux x86_64 (Debian 10, no WebUI) |
            | `opm-linux-aarch64` | Linux ARM64 (Debian 10, no WebUI) |
            | `opm-linux-x86_64-webui` | Linux x86_64 (Debian 10, with WebUI) |
            | `opm-linux-aarch64-webui` | Linux ARM64 (Debian 10, with WebUI) |
            | `opm-macos-x86_64` | macOS Intel |
            | `opm-macos-aarch64` | macOS Apple Silicon |

            ### Install or upgrade

            ```bash
            # Recommended: let opm replace itself, wherever it is installed
            opm update --check
            opm update --yes

            # Or download an asset directly
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/opm-linux-x86_64
            chmod +x opm-linux-x86_64
            sudo mv opm-linux-x86_64 /usr/local/bin/opm
            ```

            `opm update` installs over the binary it is running from, so an install in
            `~/.local/bin` or `/usr/local/bin` stays where it is.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
